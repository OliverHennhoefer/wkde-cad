[project]
name = "wkde-cad"
version = "0.1.0"
description = "Simulation and empirical evidence for theoretical limits of conformal anomaly detection"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.8",
    "nonconform==1.0.1",
    "numpy>=1.26",
    "oddball==1.3.0",
    "pandas>=2.2",
    "pyod>=2.0",
    "scikit-learn>=1.4",
    "scipy>=1.12",
    "tqdm>=4.66.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.12.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"wkde_cad.empirical.benchmark" = ["*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
